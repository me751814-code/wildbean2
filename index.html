<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    margin:0;
    background:black;
    overflow:hidden;
}

img{
    width:100vw;
    height:100vh;
    object-fit:cover;
}
</style>
</head>

<body>

<img id="slider" src="wildbean.jpeg">

<script>
const images = [
    "wildbean.jpeg",
    "yenigörsel.jpeg"
];

let index = 0;

setInterval(() => {
    index = (index + 1) % images.length;
    document.getElementById("slider").src = images[index];
}, 5000); // 5000 ms = 5 saniye
</script>

</body>
</html>
