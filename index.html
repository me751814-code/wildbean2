<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    margin:0;
    background:black;
}

#slider{
    width:100vw;
    height:100vh;
    object-fit:cover;
}
</style>
</head>

<body>

<img id="slider" src="wildbean.jpeg">

<script>
let images = [
  "wildbean.jpeg",
  "yenigörsel.jpeg"
];

let current = 0;

setInterval(function(){

  current++;

  if(current >= images.length){
    current = 0;
  }

  document.getElementById("slider").src = images[current];

}, 5000);

</script>

</body>
</html>
