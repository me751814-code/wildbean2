<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html, body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:black;
}

#slider{
    position:fixed;
    top:0;
    left:0;
    width:100vw;
    height:100vh;
    object-fit:cover;
}
</style>
</head>

<body>

<img id="slider" src="wildbean.jpeg">

<script>
const images = [
    "wildbean.jpeg",
    "yenigorsel.jpeg"
];

let current = 0;

setInterval(() => {

    current++;

    if(current >= images.length){
        current = 0;
    }

    document.getElementById("slider").src = images[current];

}, 5000);
</script>

</body>
</html>
